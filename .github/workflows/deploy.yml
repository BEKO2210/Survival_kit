# =============================================================================
#  Survival Guide - GitHub Pages Deployment
# =============================================================================
#  Automatisches Build & Deployment auf GitHub Pages
#  Astro 4.x + TailwindCSS → Static Site → GitHub Pages
#  Service Worker Version wird automatisch mit fortlaufender Build-Nummer gesetzt
# =============================================================================

name: 🚀 Deploy Survival Guide to GitHub Pages

on:
  # Bei Push auf main/master automatisch deployen
  push:
    branches: [main, master]

  # Manuelles Deployment über GitHub UI (Actions → Run workflow)
  workflow_dispatch:

# Berechtigungen für GitHub Pages Deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig - laufende abbrechen
concurrency:
  group: pages
  cancel-in-progress: true

# =============================================================================
#  Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  #  1. BUILD - Projekt bauen und Artefakte erstellen
  # ---------------------------------------------------------------------------
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      # --- Checkout ---
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      # --- Node.js Setup ---
      - name: 📦 Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Dependencies installieren ---
      - name: 📚 Abhängigkeiten installieren
        run: npm install

      # --- Build-Version generieren (fortlaufende Nummer via Run-ID) ---
      - name: 🏷️ Build-Version setzen
        run: |
          BUILD_VERSION="b${{ github.run_number }}"
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "📌 Build-Version: $BUILD_VERSION"

      # --- Astro Build ---
      - name: 🏗️ Astro Projekt bauen
        run: npm run build

      # --- Version + Commit-Message in Service Worker injizieren ---
      - name: 🔄 Service Worker versionieren
        run: |
          # Subject (erste Zeile) der letzten Commit-Message, UTF-8 safe
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git log -1 --pretty=%cI)
          export COMMIT_MSG COMMIT_SHA COMMIT_DATE
          node -e '
            const fs = require("fs");
            const f = "dist/sw.js";
            let s = fs.readFileSync(f, "utf8");
            s = s.replace(/__BUILD_VERSION__/g, process.env.BUILD_VERSION);
            // Sicheres Escapen von JS-String-Literals über JSON.stringify
            const replaceStr = (placeholder, value) => {
              const escaped = JSON.stringify(value || "");
              s = s.replace(new RegExp("\"" + placeholder + "\"", "g"), escaped);
            };
            replaceStr("__BUILD_MESSAGE__", process.env.COMMIT_MSG);
            replaceStr("__BUILD_SHA__", process.env.COMMIT_SHA);
            replaceStr("__BUILD_DATE__", process.env.COMMIT_DATE);
            fs.writeFileSync(f, s);
          '
          echo "✅ SW-Version gesetzt: ${BUILD_VERSION}"
          echo "📝 Commit: ${COMMIT_SHA} – ${COMMIT_MSG}"
          head -8 dist/sw.js

      # --- Pages Artefakt hochladen ---
      - name: 📤 Build-Artefakte hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ---------------------------------------------------------------------------
  #  2. DEPLOY - Auf GitHub Pages veröffentlichen
  # ---------------------------------------------------------------------------
  deploy:
    name: 🌍 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
